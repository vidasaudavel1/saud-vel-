<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desafio 30 Dias Funcional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --main: #f0ebe3;
      --green: #00b894;
      --green-dark: #019270;
      --gray-light: #fafafa;
      --text-dark: #2d3436;
      --accent-red: #ff7675;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--gray-light);
      color: var(--text-dark);
      line-height: 1.7;
    }

    header {
      background-color: var(--green);
      color: white;
      text-align: center;
      padding: 120px 20px 80px;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      margin-bottom: 15px;
    }

    header p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .container {
      max-width: 960px;
      margin: auto;
      padding: 60px 20px;
    }

    section {
      margin-bottom: 60px;
    }

    .intro p, .benefits ul, .order-bump ul {
      font-size: 1rem;
    }

    .benefits ul {
      list-style: none;
      padding: 0;
    }

    .benefits li {
      background: white;
      padding: 15px;
      border-left: 5px solid var(--green);
      margin-bottom: 12px;
      border-radius: 6px;
      font-weight: 600;
    }

    .testimonials, .order-bump {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .testimonials p {
      font-style: italic;
      margin-bottom: 10px;
    }

    .order-bump h3 {
      margin-bottom: 15px;
    }

    .cta {
      text-align: center;
      margin-top: 40px;
    }

    .cta a {
      background-color: var(--green);
      color: white;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    .cta a:hover {
      background-color: var(--green-dark);
      transform: scale(1.03);
    }

    .timer-box {
      background: #fef2f2;
      color: var(--accent-red);
      padding: 15px;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 30px;
      border: 1px solid var(--accent-red);
      border-radius: 6px;
    }

    #notif {
      background:#fff3cd;
      padding:10px;
      border-left:5px solid #ffb347;
      margin-bottom:20px;
      font-size:14px;
      display:none;
      border-radius: 6px;
    }

    .sticky-cta {
      display: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #999;
    }

    @media (max-width: 600px) {
      .cta a {
        font-size: 1rem;
        padding: 12px 25px;
      }
      .sticky-cta {
        display: block;
        position: fixed;
        bottom: 0;
        width: 100%;
        background: var(--green);
        text-align: center;
        padding: 15px;
        z-index: 9999;
        box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
      }
      .sticky-cta a {
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        text-decoration: none;
      }
    }
  </style>
</head>
